<!doctype html><html lang="en"><head><meta charset="utf-8">

<style>
:root{color-scheme:dark;--bg:#07070d;--red:#ff1e3c;--cy:#19e3ff;--g:#37ff8b;--y:#ffd21f;--f:Orbitron,'Arial Black',system-ui,sans-serif;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:none}
[hidden]{display:none!important}

body{display:flex;justify-content:center}
#app{position:relative;height:100%;width:min(100vw,62vh);overflow:hidden;background:#000}
canvas{position:absolute;inset:0;width:100%;height:100%}

.pill{background:rgba(10,10,20,.6);border:1px solid rgba(255,255,255,.2);border-radius:12px;padding:5px 9px;font-size:11px;font-weight:800;display:flex;align-items:center;gap:6px;pointer-events:auto;backdrop-filter:blur(6px)}

#lights i.on{background:#ff1209;box-shadow:0 0 22px #ff1209,0 0 50px #ff1209}

#ctl button.dn{background:rgba(255,255,255,.28);transform:scale(.94)}
#bb{width:calc(70px*var(--bs,1))!important;height:calc(70px*var(--bs,1))!important;font-size:11px!important;border-color:rgba(255,60,60,.7)!important;border-radius:50%!important}
#bt{width:calc(104px*var(--bs,1))!important;height:calc(104px*var(--bs,1))!important;border-radius:50%!important;font-size:14px!important;border-color:var(--cy)!important;box-shadow:0 0 20px rgba(25,227,255,.35)}
#bt.drs{border-color:var(--g)!important;box-shadow:0 0 28px var(--g);animation:pl .5s infinite alternate}

.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px;text-align:center;background:radial-gradient(circle at 50% 25%,rgba(255,30,60,.28),rgba(7,7,13,.82) 62%)}
h1{margin:0;font-size:clamp(44px,15vw,74px);line-height:.9;font-style:italic;font-weight:800;background:linear-gradient(180deg,#fff,#ff6b7d 60%,#ff1e3c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 4px 14px rgba(255,30,60,.6))}
.sub{font-size:11px;letter-spacing:4px;opacity:.75}
.big{font-family:var(--f);font-weight:800;font-size:20px;font-style:italic;color:#fff;border:0;border-radius:16px;padding:16px 38px;background:linear-gradient(135deg,#ff1e3c,#ff6a00);box-shadow:0 8px 30px rgba(255,30,60,.5);width:100%;max-width:300px}
.big.b2{background:linear-gradient(135deg,#19a8ff,#7a3cff);box-shadow:0 8px 30px rgba(60,120,255,.45);font-size:15px}
.lnk{font-family:var(--f);background:none;border:0;color:#fff;opacity:.7;font-size:12px;text-decoration:underline}
.lbl{font-size:10px;letter-spacing:3px;opacity:.6;margin-top:6px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.chip{font-family:var(--f);font-weight:800;font-size:14px;color:#fff;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.2);border-radius:12px;padding:9px 16px}
.chip.on{border-color:var(--c);box-shadow:0 0 14px var(--c);background:rgba(255,255,255,.18)}
.stat{font-size:11px;opacity:.7;letter-spacing:1px}
.ban{background:linear-gradient(90deg,rgba(122,60,255,.5),rgba(25,168,255,.5));border:1px solid rgba(255,255,255,.35);border-radius:14px;padding:10px 14px;font-size:12px;line-height:1.5}
#rp{font-size:84px;font-weight:800;font-style:italic;line-height:1;color:var(--y);text-shadow:0 0 30px rgba(255,210,31,.5)}
#rt{font-size:14px;line-height:1.7}
#rs{width:100%;max-width:300px;font-size:12px;text-align:left}#rs div{display:flex;justify-content:space-between;padding:4px 10px;border-radius:8px}#rs .me{background:rgba(255,30,60,.4);font-weight:800}
#mm{position:absolute;left:10px;top:60px;width:92px;height:92px;background:rgba(10,10,20,.55);border:1px solid rgba(255,255,255,.2);border-radius:14px}
#msg{z-index:9}h1{font-size:clamp(34px,11vw,56px)!important}.ov{gap:9px;overflow:auto}.ov .chip{padding:8px 11px;font-size:12px}h2{margin:0;font-style:italic}
#gl{width:100%;max-width:340px;max-height:64%;overflow:auto;display:flex;flex-direction:column;gap:8px;touch-action:pan-y}
.card{display:flex;gap:8px;align-items:center;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:6px 8px;text-align:left}.card.sel{border-color:var(--g)}.card canvas{position:static;width:120px;height:76px}.card.lock canvas{filter:brightness(.12) drop-shadow(0 0 5px var(--c))}.ci{flex:1;font-size:12px}.sb{display:flex;align-items:center;gap:6px;font-size:8px;margin-top:2px}.sb i{flex:1;height:4px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}.sb u{display:block;height:100%;background:var(--cy)}
input{font-family:var(--f);font-size:18px;text-align:center;text-transform:uppercase;padding:12px;border-radius:12px;border:2px solid rgba(255,255,255,.3);background:rgba(0,0,0,.4);color:#fff;width:100%;max-width:300px;user-select:text;-webkit-user-select:text;touch-action:auto}
#ed{position:absolute;top:12%;left:50%;transform:translateX(-50%);z-index:5;background:rgba(7,7,13,.88);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:10px;display:flex;flex-direction:column;gap:8px;width:92%}#lp{font-size:15px;line-height:1.9}
</style></head><body>
<div id="app"><canvas id="c"></canvas><div id="vig"></div>
<div id="hud" hidden><canvas id="mm" width="92" height="92"></canvas><div class="row"><div id="pos">P8</div><div class="mid"><div id="lap">LAP 1/3</div><div id="tm">0:00.0</div></div><div class="sp"><b id="spd">0</b><small>KM/H · G<span id="gr">N</span></small></div></div>
<div class="row2"><div class="pill" id="tyre"></div><div class="pill" id="pit">PIT OFF</div><div class="pill">ERS <span class="bar" id="ersb"><u></u></span></div></div></div>
<div id="msg"></div><div id="lights" hidden><i></i><i></i><i></i><i></i><i></i></div>
<div id="ctl" hidden><div class="g"><button id="bl">◀</button><button id="br">▶</button></div><div class="g"><button id="bb">BRAKE</button><button id="bt">BOOST</button></div></div>
<div id="menu" class="ov"><h1>APEX<br>RUSH</h1><div class="sub">GRAND PRIX · 8 CAR GRID</div>
<div id="chb" class="ban" hidden></div>
<div class="lbl">STARTING TYRE</div><div class="chips" id="ct"></div>
<div class="lbl" id="ll">RACE LENGTH</div><div class="chips" id="cl"></div>
<div class="lbl" id="tl">TRACK</div><div class="chips" id="ctr"></div><button class="big" id="go">START ENGINES</button><div class="chips"><button class="chip" id="bg">🏎 GARAGE</button><button class="chip" id="bo">🌐 ONLINE</button><button class="chip" id="bc">🎮 CONTROLS</button></div><button class="lnk" id="free" hidden>skip challenge · free race</button>
<div class="stat" id="st"></div></div>
<div id="res" class="ov" hidden><div class="sub">CHEQUERED FLAG</div><div id="rp">P1</div><div id="rt"></div><div id="rs"></div>
<button class="big" id="again">RACE AGAIN</button><button class="big b2" id="shr">⚔ CHALLENGE A FRIEND</button><button class="lnk" id="home">menu</button></div>
<div id="gar" class="ov" hidden><h2>GARAGE</h2><div class="stat" id="gp"></div><div id="gl"></div><button class="lnk" id="gx">← back</button></div>
<div id="on" class="ov" hidden><h2>ONLINE RACE</h2><div class="sub">RACE FRIENDS LIVE</div><button class="big" id="oc">CREATE ROOM</button><input id="oi" maxlength="6" placeholder="ROOM CODE"><button class="big b2" id="oj">JOIN ROOM</button><div class="stat" id="os"></div><button class="lnk" id="ox">← back</button></div>
<div id="lob" class="ov" hidden><div class="sub">ROOM CODE</div><h1 id="lc">-----</h1><div id="lp"></div><button class="big" id="ls">START RACE</button><button class="big b2" id="li">⚔ INVITE FRIENDS</button><button class="lnk" id="lx">leave</button></div>
<div id="ed" hidden><div class="sub">DRAG BUTTONS ANYWHERE</div><div class="chips" id="e1"></div><div class="chips" id="e2"></div><div class="chips"><button class="chip" id="er">RESET</button><button class="chip on" id="ed2" style="--c:#37ff8b">DONE</button></div></div>
</div>
<script>
const $=id=>document.getElementById(id),tg=window.Telegram&&Telegram.WebApp,BOT='https://t.me/Formula2game_bot/Formula2',API='https://formula-2-1.onrender.com/'; // BOT: your Mini App link · API: your server.js URL (Stars shop + live rooms)
let save={xp:0,races:0,best:0,wins:0,pts:0,car:'rk',own:['rk'],trk:0,ui:null};try{Object.assign(save,JSON.parse(localStorage.getItem('apex')||'{}'))}catch(e){}
const store=()=>{try{localStorage.setItem('apex',JSON.stringify(save))}catch(e){}};
if(tg){try{tg.ready();tg.expand();tg.disableVerticalSwipes&&tg.disableVerticalSwipes();tg.lockOrientation&&tg.lockOrientation();tg.setHeaderColor&&tg.setHeaderColor('#07070d');tg.setBackgroundColor&&tg.setBackgroundColor('#07070d')}catch(e){}}
let hl=0;const hap=t=>{const n=performance.now();if(n-hl<160)return;hl=n;try{tg.HapticFeedback.impactOccurred(t||'light')}catch(e){}};
const NAME=((tg&&tg.initDataUnsafe&&tg.initDataUnsafe.user&&tg.initDataUnsafe.user.first_name)||'YOU').replace(/[^A-Za-z0-9]/g,'').slice(0,8)||'YOU';
const rng=s=>()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),fmt=t=>Math.floor(t/60)+':'+(t%60).toFixed(1).padStart(4,'0'),fmt3=t=>Math.floor(t/60)+':'+(t%60).toFixed(3).padStart(6,'0');
const SEG=200,RW=900,D=.84,CAMH=1000,PD=900,DRAW=110,MAXV=11000,HOR=.34;
const COMP=[{n:'S',c:'#ff2a3d',sp:1.03,g:1.1,wr:1.6},{n:'M',c:'#ffd21f',sp:1,g:1,wr:1},{n:'H',c:'#f2f2f2',sp:.975,g:.92,wr:.6}];
const BC=['#ff1e3c','#19e3ff','#ffd21f','#b24bff','#37ff8b'];
let segs=[],N=1,L=1,LAPS=3,seed=1,P,cars=[],state='menu',lights=0,goT=6,pitT=0,shake=0,sel=1,pitSel=-1,bx=0,parts=[],lastPos=8,ch=null,lapStart=0,bestL=0,raceT=0,keys={},msgT=0,res=null,hudT=0,W=1,H=1,dpr=1,demo=0,trk=save.trk||0,online=false,net=null,code='',host=false,editing=false,drag=null,flash=0,wp=[],lastGo=0,nt=0;
const sp0=(tg&&tg.initDataUnsafe&&tg.initDataUnsafe.start_param)||location.hash.slice(1),q0=sp0.split('-');
if(q0.length>=4&&+q0[0]&&+q0[1])ch={seed:+q0[0],ms:+q0[1]/1000,laps:+q0[2]||3,n:q0[3],trk:+q0[4]||0};
const joinCode=q0[0]=='r'&&q0[1]?q0[1].toUpperCase().replace(/[^A-Z0-9]/g,''):'';
let ctx;const mod=z=>((z%L)+L)%L,cv=$('c');ctx=cv.getContext('2d');
function rs(){const a=$('app');W=a.clientWidth;H=a.clientHeight;dpr=Math.min(devicePixelRatio||1,2);cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',rs);
function build(sd){const r=rng(sd+trk*1013);segs=[];
 const add=(len,c,d)=>{for(let k=0;k<len;k++)segs.push({c:c*Math.sin(Math.PI*(k+.5)/len),d:d&&k>8&&k<len-8?1:0,i:segs.length})};
 add(100,0,1);
 for(let j=0;j<34;j++){if(r()<TR[trk].st)add(45+r()*55|0,0,1);else{const len=26+r()*44|0;add(len,(r()<.5?-1:1)*(.9+r()*2.3)*(len<36?1.35:1)*TR[trk].cv)}}
 add(70,0,0);N=segs.length;L=N*SEG;mmBuild()}
function init(){build(seed);const r=rng(seed+99),lv=Math.floor(Math.sqrt(save.xp/100));if(online){onInit();return}
 const nm=['NOV','KES','BLT','VEG','ORI','ZEP','ROG'],cl=['#ff7a00','#19e3ff','#37ff8b','#ffd21f','#b24bff','#f2f2f2','#ff4fa3'];cars=[];let ai=0;
 for(let s=0;s<8;s++){const b={z:-(s+1)*260,x:s%2?.4:-.4,v:0,w:0,cp:1};
  if(s==7){P=Object.assign(b,{n:NAME,k:me(),c:me().c,e:.5,sv:0,lap:1,cp:sel,dr:false,gp:0});cars.push(P)}
  else{cars.push(Object.assign(b,{n:nm[ai],c:cl[ai],sk:.86+r()*.1+Math.min(.06,lv*.006),tx:b.x,t:0,fin:0}));ai++}}
 raceT=0;lapStart=0;bestL=0;lastPos=8;bx=0;parts=[];goT=5*.85+.6+Math.random()*.9}
function msg(t,ms){const m=$('msg');m.textContent=t;m.classList.remove('s');void m.offsetWidth;m.classList.add('s');clearTimeout(msgT);msgT=setTimeout(()=>m.classList.remove('s'),ms||1000)}
function spark(x,y,c,n){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.5)*260,vy:-Math.random()*220,l:.5,c})}
function chips(el,opts,get,set){el.innerHTML='';opts.forEach(o=>{const b=document.createElement('button');b.className='chip'+(get()==o.v?' on':'');b.textContent=o.t;b.style.setProperty('--c',o.c||'#fff');b.onclick=()=>{set(o.v);chips(el,opts,get,set)};el.appendChild(b)})}
function menu(){state='menu';const lv=Math.floor(Math.sqrt(save.xp/100))+1;
 $('st').textContent=`LEVEL ${lv} · BEST LAP ${save.best?fmt3(save.best):'--'} · WINS ${save.wins} · ${save.pts} PTS`;
 $('menu').hidden=false;$('res').hidden=$('gar').hidden=$('on').hidden=$('lob').hidden=$('ed').hidden=true;$('hud').hidden=$('ctl').hidden=$('lights').hidden=true;
 $('chb').hidden=$('free').hidden=!ch;$('ll').hidden=$('cl').hidden=$('tl').hidden=$('ctr').hidden=!!ch;
 if(ch)$('chb').innerHTML=`⚔ <b>${ch.n}</b> challenges you!<br>Beat <b>${fmt3(ch.ms)}</b> over ${ch.laps} laps on their track`;
 chips($('ctr'),TR.map((t,i)=>({t:t.n,v:i})),()=>trk,v=>{trk=v;save.trk=v;store();seed=Math.random()*1e6|0;init();P.x=0;P.z=0});chips($('ct'),COMP.map((c,i)=>({t:c.n,v:i,c:c.c})),()=>sel,v=>sel=v);
 chips($('cl'),[2,3,5].map(v=>({t:v+' LAPS',v})),()=>LAPS,v=>LAPS=v);
 if(ch)trk=ch.trk;online=false;seed=Math.random()*1e6|0;init();P.x=0;P.z=0}
let ac,osc,gn;function sfx(){if(ac)return;try{ac=new(window.AudioContext||webkitAudioContext)();osc=ac.createOscillator();osc.type='sawtooth';const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=800;gn=ac.createGain();gn.gain.value=0;osc.connect(f);f.connect(gn);gn.connect(ac.destination);osc.start()}catch(e){ac=null}}
function start(o){sfx();if(o){seed=o.seed;trk=o.trk;LAPS=o.laps;online=true}else{online=false;if(ch){seed=ch.seed;LAPS=ch.laps;trk=ch.trk}else seed=Math.random()*1e6|0}init();state='grid';lights=0;pitSel=-1;
 $('menu').hidden=$('res').hidden=true;$('hud').hidden=$('ctl').hidden=$('lights').hidden=false;pitUI();tyreUI();msg('LIGHTS OUT SOON',1200)}
function pitUI(){$('pit').textContent=pitSel<0?'PIT OFF':'PIT → '+COMP[pitSel].n;$('pit').style.borderColor=pitSel<0?'':COMP[pitSel].c}
function tyreUI(){const c=COMP[P.cp];$('tyre').innerHTML=`<span style="color:${c.c};font-size:15px">●</span>${c.n}<span class="bar"><u id="wr"></u></span>`}
$('pit').onclick=()=>{pitSel=pitSel>=2?-1:pitSel+1;pitUI();hap('medium')};
$('go').onclick=()=>start();$('free').onclick=()=>{ch=null;history.replaceState&&history.replaceState(null,'',location.pathname);menu()};
$('again').onclick=()=>online&&net?lobbyShow():start();$('home').onclick=()=>{leaveNet();menu()};$('shr').onclick=share;
function share(){const code=[seed,Math.round(res.t*1000),LAPS,NAME,trk].join('-'),link=BOT+'?startapp='+code,txt=`🏎️ I finished P${res.pos} in ${fmt3(res.t)} on APEX RUSH! Think you can beat me on the same track?`,u='https://t.me/share/url?url='+encodeURIComponent(link)+'&text='+encodeURIComponent(txt);
 if(tg&&tg.openTelegramLink)tg.openTelegramLink(u);else{try{navigator.clipboard.writeText(txt+' '+link);msg('LINK COPIED',1400)}catch(e){msg('OPEN IN TELEGRAM',1400)}}}
function finish(){state='fin';const pos=cars.filter(c=>c.z>P.z).length+1;res={pos,t:raceT,best:bestL};
 const xp=Math.max(0,9-pos)*25+(pos==1?100:0);save.xp+=xp;save.races++;if(pos==1)save.wins++;const pt=pos==1?300:pos==2?180:pos==3?120:pos<=5?50:15;save.pts+=pt;res.pts=pt;store();res.xp=xp;if(pos<=3)for(let i=0;i<90;i++)parts.push({x:Math.random()*W,y:-10,vx:(Math.random()-.5)*120,vy:Math.random()*150,l:3,c:BC[i%5]});
 msg(pos==1?'VICTORY!':'FINISH P'+pos,1800);hap('heavy');setTimeout(showRes,1800)}
function showRes(){$('res').hidden=false;$('hud').hidden=$('ctl').hidden=true;$('rp').textContent='P'+res.pos;
 let cm='';if(ch&&seed==ch.seed){const d=res.t-ch.ms;cm=d<0?`<br>🏆 You beat ${ch.n} by ${(-d).toFixed(3)}s!`:`<br>😤 ${ch.n} wins by ${d.toFixed(3)}s`}
 $('rt').innerHTML=`TIME ${fmt3(res.t)} · BEST LAP ${res.best?fmt3(res.best):'--'}<br>+${res.pts} PTS · +${res.xp} XP${cm}`;
 $('rs').innerHTML=[...cars].sort((a,b)=>b.z-a.z).map((c,i)=>`<div class="${c===P?'me':''}"><span>P${i+1} ${c.n}</span><span style="color:${c.c}">■</span></div>`).join('');
 $('shr').hidden=online;if(ch&&res.pos>0)$('again').textContent='RETRY CHALLENGE'}
function player(dt){const sg=segs[Math.floor(mod(P.z)/SEG)%N],cp=COMP[P.cp],cr=P.k,pct=P.v/MAXV,racing=state=='race';
